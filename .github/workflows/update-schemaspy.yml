# SchemaspyでER図を生成してS3にアップロード
name: schemaspy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write # OIDCでAWSにアクセス
  contents: read # actions/checkoutで必要

jobs:
  schemaspy:
    runs-on: ubuntu-latest
    # MySQLのコンテナを立ち上げる
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: my_database
          MYSQL_USER: user
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uuser -ppassword" 
          --health-interval=10s 
          --health-timeout=5s 
          --health-retries=3
    steps:
      - uses: actions/checkout@v4

      # マイグレーションを実行
      - name: Migration
        run: # ここにマイグレーションの処理を書く

      # SchemaSpyを実行
      - name: SchemaSpy
        run: docker compose -f compose.schemaspy.yml up

      # AWSに接続するための設定
      - name: Set up AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: # ここに作成したIAMロールのARNを入れる 例: arn:aws:iam::<アカウントID>:role/<ロール名>
          aws-region: ap-northeast-1 # 東京リージョン

      # S3にアップロード
      - name: Upload to S3
        run: |
          aws s3 sync ./output s3://my-schemaspy --delete
